name: Auto Update Calendar

on:
  schedule:
    - cron: '0 9,21 * * *' # Runs at 9:00 AM and 9:00 PM UTC (Note: GitHub Actions cron runs in UTC)
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  update-calendar:
    runs-on: ubuntu-24.04 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Run Python Script
        run: python fetch_calendar.py

      - name: Commit and Push the updated .ics file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add economic_and_earnings_events.ics instruments_mapping.json
          git commit -m "Auto-updated calendar data" || exit 0
          git push
