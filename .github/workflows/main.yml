name: Auto Update Calendar

on:
  schedule:
    - cron: '0 9,21 * * *'
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests curl_cffi

      - name: Run Python Script
        run: python fetch_calendar.py

      - name: Commit and Push the updated files
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add economic_and_earnings_events.ics instruments_mapping.json
          git commit -m "Auto-updated calendar data" || exit 0
          git push
