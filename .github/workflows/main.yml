name: Auto Update Calendar

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to click a button to run it manually

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests curl_cffi

      - name: Run Python Script
        run: python fetch_calendar.py

      - name: Commit and Push the updated .ics file
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add economic_and_earnings_events.ics
          git commit -m "Auto-updated calendar data" || exit 0
          git push
